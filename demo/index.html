<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locale JSON Merger</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --accent-hover: #5ca0ff;
      --ok: #3dd68c;
      --warn: #f5a524;
      --err: #f04438;
      --code: #0b1220;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, #1a3a5c 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 10%, #1a2f45 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0 0 1.75rem;
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .panel label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      background: var(--code);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    select {
      width: 10rem;
      padding: 0.55rem 0.7rem;
      background: var(--code);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    .key-count {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin: 1rem 0;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }

    .process-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .process-status.hidden { display: none; }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      min-width: 8rem;
    }

    .stat .n {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat .l {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat.missing .n { color: var(--err); }
    .stat.extra .n { color: var(--warn); }
    .stat.ok .n { color: var(--ok); }

    pre {
      margin: 0;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .result-metric {
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .result-metric strong {
      display: block;
      color: var(--text);
      font-size: 1.15rem;
    }

    @media (max-width: 520px) {
      .result-metrics { grid-template-columns: 1fr; }
    }

    .error {
      color: var(--err);
      margin: 0.5rem 0 0;
      font-size: 0.95rem;
    }

    .hidden { display: none; }

    .list {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--muted);
    }

    .list li { margin: 0.2rem 0; }
    .list.missing li { color: #ff8f86; }
    .list.extra li { color: #ffc56d; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .result-header label { margin-bottom: 0; }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .file-picker {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .file-picker input[type="file"] {
      max-width: 100%;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .file-picker select {
      width: auto;
      min-width: 12rem;
    }

    .copy-button {
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
    }

    .copy-status {
      min-width: 4.5rem;
      color: var(--ok);
      font-size: 0.8rem;
      text-align: right;
    }

    .mixed-values {
      margin: -0.25rem 0 1rem;
      padding: 0.85rem 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .mixed-values h2 {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
    }

    .mixed-values summary {
      cursor: pointer;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .mixed-values summary::marker { color: var(--accent); }

    .mixed-values-content { margin-top: 0.6rem; }

    .mixed-values .list { margin-bottom: 0; }

    .mixed-values code {
      color: var(--text);
    }

    .translation-report {
      margin: -0.25rem 0 1rem;
      padding: 0.85rem 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .translation-report h2 {
      margin: 0 0 0.5rem;
      font-size: 0.9rem;
    }

    .translation-report summary {
      cursor: pointer;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .translation-report summary::marker { color: var(--accent); }

    .translation-report-content { margin-top: 0.6rem; }

    .translation-report .list { margin-bottom: 0; }

    .translation-report .source { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Locale JSON Merger</h1>
      <p>Compare a child locale against the English master. Missing keys get English fallbacks; existing translations are never overwritten.</p>
    </header>

    <div class="grid">
      <div class="panel">
        <div class="editor-header">
          <label for="master">Master (en.json)</label>
          <button type="button" class="secondary copy-button" id="btn-copy-master">Copy</button>
        </div>
        <div class="file-picker">
          <select id="master-server-file" aria-label="Master file from storage app locales">
            <option value="">Load from storage/app/locales...</option>
          </select>
          <input type="file" id="master-file" accept=".json,application/json">
        </div>
        <textarea id="master" spellcheck="false">{
  "welcome": "Welcome",
  "menu": {
    "home": "Home",
    "settings": "Settings"
  },
  "auth": {
    "login": {
      "title": "Login",
      "email": "Email",
      "password": "Password"
    }
  },
  "languages": ["English", "French", "Japanese"]
}</textarea>
      <div class="key-count" id="master-count" aria-live="polite"></div>
      </div>
      <div class="panel">
        <div class="editor-header">
          <label for="child">Child locale (e.g. fr.json)</label>
          <button type="button" class="secondary copy-button" id="btn-copy-child">Copy</button>
        </div>
        <div class="file-picker">
          <select id="child-server-file" aria-label="Child file from storage app locales">
            <option value="">Load from storage/app/locales...</option>
          </select>
          <input type="file" id="child-file" accept=".json,application/json">
        </div>
        <textarea id="child" spellcheck="false">{
  "welcome": "Bienvenue",
  "menu": {
    "home": "Accueil"
  },
  "auth": {
    "login": {
      "title": "Connexion"
    }
  },
  "legacy": {
    "title": "Ancien titre"
  },
  "ja": "こんにちは"
}</textarea>
      <div class="key-count" id="child-count" aria-live="polite"></div>
      </div>
    </div>

    <div class="toolbar">
      <label class="toggle">
        <input type="checkbox" id="sort" checked>
        Sort keys alphabetically
      </label>
      <label class="toggle" for="target-language">
        Target language
        <select id="target-language">
          <option value="French">French</option>
          <option value="Vietnamese">Vietnamese</option>
          <option value="Japanese">Japanese</option>
          <option value="Chinese">Chinese</option>
          <option value="Korean">Korean</option>
          <option value="Hindi">Indian (Hindi)</option>
          <option value="Turkish">Turkish</option>
          <option value="Malay">Malaysia (Malay)</option>
          <option value="Arabic">Arabic</option>
          <option value="Russian">Russian</option>
          <option value="Nepali">Nepali</option>
        </select>
      </label>
      <button type="button" id="btn-check">Check</button>
      <button type="button" id="btn-merge" disabled>Merge</button>
      <button type="button" id="btn-translate" disabled>Translate</button>
      <button type="button" class="secondary" id="btn-sample">Reset samples</button>
      <span class="process-status hidden" id="process-status" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="process-label">Translating mixed English values...</span>
      </span>
    </div>

    <p id="error" class="error hidden"></p>

    <div id="stats" class="stats hidden"></div>
    <details id="mixed-values" class="mixed-values hidden" open>
      <summary>English values still present in the child locale</summary>
      <div id="mixed-values-content" class="mixed-values-content"></div>
    </details>
    <details id="translation-report" class="translation-report hidden">
      <summary id="translation-report-summary">Translation report</summary>
      <div id="translation-report-content" class="translation-report-content"></div>
    </details>

    <div class="grid">
      <div class="panel">
        <label>Missing / extra keys</label>
        <div id="keys"></div>
      </div>
      <div class="panel">
        <div class="result-header">
          <label>Result JSON</label>
          <span class="copy-status" id="copy-status" aria-live="polite"></span>
          <button type="button" class="secondary copy-button" id="btn-copy" disabled>Copy JSON</button>
        </div>
        <pre id="result">Run Check or Merge to see output.</pre>
        <div class="result-metrics hidden" id="result-metrics" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script>
    const masterEl = document.getElementById('master');
    const childEl = document.getElementById('child');
    const masterFileEl = document.getElementById('master-file');
    const childFileEl = document.getElementById('child-file');
    const masterServerFileEl = document.getElementById('master-server-file');
    const childServerFileEl = document.getElementById('child-server-file');
    const masterCountEl = document.getElementById('master-count');
    const childCountEl = document.getElementById('child-count');
    const sortEl = document.getElementById('sort');
    const targetLanguageEl = document.getElementById('target-language');
    const errorEl = document.getElementById('error');
    const statsEl = document.getElementById('stats');
    const keysEl = document.getElementById('keys');
    const resultEl = document.getElementById('result');
    const resultMetricsEl = document.getElementById('result-metrics');
    const btnCheck = document.getElementById('btn-check');
    const btnMerge = document.getElementById('btn-merge');
    const btnTranslate = document.getElementById('btn-translate');
    const btnCopy = document.getElementById('btn-copy');
    const btnCopyMaster = document.getElementById('btn-copy-master');
    const btnCopyChild = document.getElementById('btn-copy-child');
    const copyStatusEl = document.getElementById('copy-status');
    const mixedValuesEl = document.getElementById('mixed-values');
    const mixedValuesContentEl = document.getElementById('mixed-values-content');
    const translationReportEl = document.getElementById('translation-report');
    const translationReportSummaryEl = document.getElementById('translation-report-summary');
    const translationReportContentEl = document.getElementById('translation-report-content');
    const processStatusEl = document.getElementById('process-status');
    let mergedData = null;
    let mergePayload = null;
    let checkPassed = false;
    let mergePassed = false;

    const samples = {
      master: masterEl.value,
      child: childEl.value,
    };

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.toggle('hidden', !msg);
    }

    function resetWorkflow() {
      checkPassed = false;
      mergePassed = false;
      mergedData = null;
      mergePayload = null;
      btnMerge.disabled = true;
      btnTranslate.disabled = true;
      btnCopy.disabled = true;
      translationReportEl.classList.add('hidden');
      translationReportContentEl.innerHTML = '';
    }

    function parseJson(label, text) {
      try {
        const value = JSON.parse(text);
        if (value === null || typeof value !== 'object' || Array.isArray(value)) {
          throw new Error(label + ' must be a JSON object.');
        }
        return value;
      } catch (e) {
        throw new Error(label + ': ' + e.message);
      }
    }

    async function loadJsonFile(input, target, label) {
      const file = input.files[0];

      if (!file) {
        return;
      }

      try {
        target.value = await file.text();
        parseJson(label, target.value);
        updateKeyCount(target, label === 'Master' ? masterCountEl : childCountEl);
        mergedData = null;
        resetWorkflow();
        resultEl.textContent = 'Run Check or Merge to see output.';
        btnCopy.disabled = true;
        translationReportEl.classList.add('hidden');
        showError('');
      } catch (error) {
        showError(error.message);
      }
    }

    async function loadServerJsonFile(input, target, label) {
      const filename = input.value;

      if (!filename) {
        return;
      }

      try {
        const response = await fetch('/api/locale-file?name=' + encodeURIComponent(filename), {
          headers: { 'Accept': 'application/json' },
        });
        const payload = await response.json();

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || 'Unable to load locale file.');
        }

        target.value = JSON.stringify(payload.data, null, 2);
        updateKeyCount(target, label === 'Master' ? masterCountEl : childCountEl);
        mergedData = null;
        mergePayload = null;
        btnTranslate.disabled = true;
        resultEl.textContent = 'Run Check or Merge to see output.';
        btnCopy.disabled = true;
        translationReportEl.classList.add('hidden');
        showError('');
      } catch (error) {
        showError(error.message);
      }
    }

    function countLeafKeys(value) {
      return Object.values(value).reduce((count, item) => {
        if (item !== null && typeof item === 'object' && !Array.isArray(item)) {
          return count + countLeafKeys(item);
        }

        return count + 1;
      }, 0);
    }

    function updateKeyCount(input, output) {
      try {
        output.textContent = 'Total keys: ' + countLeafKeys(parseJson('Locale', input.value));
      } catch (e) {
        output.textContent = 'Total keys: Invalid JSON';
      }
    }

    function forEachLeafValue(value, callback) {
      Object.values(value).forEach(item => {
        if (item !== null && typeof item === 'object' && !Array.isArray(item)) {
          forEachLeafValue(item, callback);
          return;
        }

        callback(item);
      });
    }

    function countWords(value) {
      let count = 0;
      forEachTextValue(value, item => {
        if (typeof item === 'string' && item.trim()) {
          count += item.trim().split(/\s+/u).length;
        }
      });
      return count;
    }

    function countStringValues(value) {
      let count = 0;
      forEachTextValue(value, item => {
        if (typeof item === 'string') {
          count += 1;
        }
      });
      return count;
    }

    function findMixedEnglishValues(master, child, prefix = '', keyPath = []) {
      const matches = [];

      Object.entries(child).forEach(([key, childValue]) => {
        const path = prefix ? prefix + '.' + key : key;
        const masterValue = master?.[key];
        const nextKeyPath = [...keyPath, key];

        if (childValue !== null && typeof childValue === 'object' && !Array.isArray(childValue)) {
          if (masterValue !== null && typeof masterValue === 'object' && !Array.isArray(masterValue)) {
            matches.push(...findMixedEnglishValues(masterValue, childValue, path, nextKeyPath));
          }
          return;
        }

        if (typeof childValue === 'string' && typeof masterValue === 'string' && childValue === masterValue) {
          matches.push({ path, keyPath: nextKeyPath, value: childValue });
        }
      });

      return matches;
    }

    function findChangedTextValues(before, after, prefix = '') {
      const changes = [];

      if (before !== null && typeof before === 'object' && after !== null && typeof after === 'object') {
        Object.entries(after).forEach(([key, afterValue]) => {
          const path = prefix ? prefix + '.' + key : key;
          changes.push(...findChangedTextValues(before[key], afterValue, path));
        });
        return changes;
      }

      if (typeof before === 'string' && typeof after === 'string' && before !== after) {
        changes.push({ path: prefix, before, after });
      }

      return changes;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function forEachTextValue(value, callback) {
      if (Array.isArray(value)) {
        value.forEach(item => forEachTextValue(item, callback));
        return;
      }

      if (value !== null && typeof value === 'object') {
        forEachLeafValue(value, item => forEachTextValue(item, callback));
        return;
      }

      callback(value);
    }

    function renderResultMetrics(totalData) {
      resultMetricsEl.innerHTML = `
        <div class="result-metric"><strong>${countLeafKeys(totalData)}</strong>Total keys</div>
      `;
      resultMetricsEl.classList.remove('hidden');
    }

    function renderLists(payload, master, child) {
      const missing = payload.missing_keys || [];
      const extra = payload.extra_keys || [];
      const conflicts = payload.type_conflicts || [];
      const mixedValues = findMixedEnglishValues(master, child);

      keysEl.innerHTML = `
        <p style="margin:0 0 .4rem;color:var(--muted)">Missing (${missing.length})</p>
        <ul class="list missing">${missing.length ? missing.map(k => `<li>${k}</li>`).join('') : '<li>None</li>'}</ul>
        <p style="margin:1rem 0 .4rem;color:var(--muted)">Extra (${extra.length})</p>
        <ul class="list extra">${extra.length ? extra.map(k => `<li>${k}</li>`).join('') : '<li>None</li>'}</ul>
        ${conflicts.length ? `
          <p style="margin:1rem 0 .4rem;color:var(--muted)">Type conflicts (${conflicts.length})</p>
          <ul class="list">${conflicts.map(c => `<li>${c.path} — master:${c.master_type}, child:${c.child_type}</li>`).join('')}</ul>
        ` : ''}
      `;

      const missingCount = payload.missing_count ?? missing.length;
      statsEl.classList.remove('hidden');
      statsEl.innerHTML = `
        <div class="stat ${missingCount ? 'missing' : 'ok'}"><div class="n">${missingCount}</div><div class="l">Missing</div></div>
        <div class="stat extra"><div class="n">${payload.extra_count ?? extra.length}</div><div class="l">Extra</div></div>
        <div class="stat"><div class="n">${conflicts.length}</div><div class="l">Conflicts</div></div>
        <div class="stat"><div class="n">${countStringValues(master)}</div><div class="l">English values</div></div>
        <div class="stat"><div class="n">${countStringValues(child)}</div><div class="l">Other language values</div></div>
        <div class="stat ${mixedValues.length ? 'missing' : 'ok'}"><div class="n">${mixedValues.length}</div><div class="l">English values mixed in</div></div>
      `;

      mixedValuesEl.classList.toggle('hidden', mixedValues.length === 0);
      mixedValuesEl.open = mixedValues.length > 0;
      mixedValuesContentEl.innerHTML = mixedValues.length ? `
        <ul class="list">
          ${mixedValues.map(item => `<li><code>${escapeHtml(item.path)}</code>: ${escapeHtml(item.value)}</li>`).join('')}
        </ul>
      ` : '';
    }

    function renderTranslationReport(before, after) {
      const changes = findChangedTextValues(before, after);
      translationReportEl.classList.toggle('hidden', changes.length === 0);
      translationReportEl.open = false;
      translationReportSummaryEl.textContent = `Translation report (${changes.length} values)`;
      translationReportContentEl.innerHTML = changes.length ? `
        <ul class="list">
          ${changes.map(item => `
            <li><code>${escapeHtml(item.path)}</code>: <span class="source">${escapeHtml(item.before)}</span> &rarr; ${escapeHtml(item.after)}</li>
          `).join('')}
        </ul>
      ` : '';
    }

    function setValueAtPath(object, keys, value) {
      if (!Array.isArray(keys) || keys.length === 0) {
        throw new Error('Translation returned an invalid key path.');
      }

      const finalKey = keys.pop();
      let current = object;

      keys.forEach(key => {
        if (current === null || typeof current !== 'object' || !(key in current)) {
          throw new Error(`Translation path not found: ${keys.join('.')}.${key}`);
        }

        current = current[key];
      });

      if (current === null || typeof current !== 'object') {
        throw new Error(`Translation path is not writable: ${keys.join('.')}.${finalKey}`);
      }

      current[finalKey] = value;
    }

    function splitIntoChunks(items, maxItems = 20, maxCharacters = 6000) {
      const chunks = [];
      let chunk = [];
      let characters = 0;

      items.forEach(item => {
        const itemSize = item.text.length + item.path.length;

        if (chunk.length && (chunk.length >= maxItems || characters + itemSize > maxCharacters)) {
          chunks.push(chunk);
          chunk = [];
          characters = 0;
        }

        chunk.push(item);
        characters += itemSize;
      });

      if (chunk.length) {
        chunks.push(chunk);
      }

      return chunks;
    }

    async function translateMergedValues() {
      showError('');

      if (!mergePassed || mergedData === null) {
        showError('Complete Check and Merge before translating.');
        return;
      }

      const master = parseJson('Master', masterEl.value);
      const before = JSON.parse(JSON.stringify(mergedData));
      const mixedValues = findMixedEnglishValues(master, before);

      if (!mixedValues.length) {
        renderTranslationReport(before, before);
        showError('No mixed English values need translation.');
        return;
      }

      const targetLanguage = targetLanguageEl.value;
      const confirmed = window.confirm(
        `Translate ${mixedValues.length} mixed English value${mixedValues.length === 1 ? '' : 's'} into ${targetLanguage}?\n\nPlease confirm that this is the correct target language.`,
      );

      if (!confirmed) {
        return;
      }

      const items = mixedValues.map((item, index) => ({
        id: index,
        path: item.path,
        key_path: item.keyPath,
        text: item.value,
      }));
      const chunks = splitIntoChunks(items);
      const translated = JSON.parse(JSON.stringify(before));

      btnCheck.disabled = true;
      btnMerge.disabled = true;
      btnTranslate.disabled = true;
      processStatusEl.classList.remove('hidden');

      try {
        for (let index = 0; index < chunks.length; index += 1) {
          processStatusEl.querySelector('#process-label').textContent = `Translating chunk ${index + 1} of ${chunks.length}...`;
          const response = await fetch('/api/translate-chunk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              target_language: targetLanguage,
              items: chunks[index],
            }),
          });
          const payload = await response.json();

          if (!response.ok || payload.success === false) {
            throw new Error(payload.message || ('Translation failed with status ' + response.status));
          }

          chunks[index].forEach(item => {
            setValueAtPath(translated, [...item.key_path], payload.translations[String(item.id)]);
          });
        }

        mergedData = translated;
        resultEl.textContent = JSON.stringify(translated, null, 2);
        renderLists(mergePayload, master, translated);
        renderResultMetrics(translated);
        renderTranslationReport(before, translated);
        btnCopy.disabled = false;
      } catch (error) {
        showError(error.message);
      } finally {
        btnCheck.disabled = false;
        btnMerge.disabled = false;
        btnTranslate.disabled = mergedData === null;
        processStatusEl.classList.add('hidden');
      }
    }

    async function copyText(text, statusEl = null) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const copyTarget = document.createElement('textarea');
          copyTarget.value = text;
          copyTarget.setAttribute('readonly', '');
          copyTarget.style.position = 'fixed';
          copyTarget.style.opacity = '0';
          document.body.appendChild(copyTarget);
          copyTarget.select();
          document.execCommand('copy');
          copyTarget.remove();
        }

        if (statusEl) {
          statusEl.textContent = 'Copied';
          window.setTimeout(() => { statusEl.textContent = ''; }, 1500);
        }

        return true;
      } catch (e) {
        if (statusEl) {
          statusEl.textContent = 'Copy failed';
        }

        return false;
      }
    }

    async function copyInput(input, button) {
      const original = button.textContent;
      button.textContent = (await copyText(input.value)) ? 'Copied' : 'Copy failed';
      window.setTimeout(() => { button.textContent = original; }, 1500);
    }

    function copyResult() {
      copyText(resultEl.textContent, copyStatusEl);
    }

    async function call(action, requestMaster = null, requestChild = null) {
      showError('');
      btnCheck.disabled = true;
      btnMerge.disabled = true;
      btnTranslate.disabled = true;
      processStatusEl.classList.toggle('hidden', action !== 'translate');

      if (action !== 'translate') {
        translationReportEl.classList.add('hidden');
        translationReportContentEl.innerHTML = '';
      }

      try {
        const master = requestMaster ?? parseJson('Master', masterEl.value);
        const child = requestChild ?? parseJson('Child', childEl.value);

        const requestBody = {
          master_data: master,
          child_data: child,
          sort: sortEl.checked,
        };

        const res = await fetch(action === 'check' ? '/api/check' : '/api/merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(requestBody),
        });

        const payload = await res.json();
        if (!res.ok || payload.success === false) {
          throw new Error(payload.message || ('Request failed with status ' + res.status));
        }

        const resultData = payload.data ?? payload.merged ?? payload;
        renderLists(payload, master, action === 'translate' ? resultData : child);
        resultEl.textContent = JSON.stringify(resultData, null, 2);
        renderResultMetrics(resultData);
        btnCopy.disabled = false;

        if (action === 'check') {
          checkPassed = true;
          mergePassed = false;
          mergedData = null;
          mergePayload = null;
        } else if (action === 'merge') {
          mergePassed = true;
          mergedData = resultData;
          mergePayload = payload;
        }
      } catch (e) {
        showError(e.message);
      } finally {
        btnCheck.disabled = false;
        btnMerge.disabled = !checkPassed;
        btnTranslate.disabled = !mergePassed || mergedData === null;
        processStatusEl.classList.add('hidden');
      }
    }

    btnCheck.addEventListener('click', () => call('check'));
    btnMerge.addEventListener('click', () => {
      if (!checkPassed) {
        showError('Run Check successfully before Merge.');
        return;
      }

      mergePassed = false;
      mergedData = null;
      mergePayload = null;
      call('merge');
    });
    btnTranslate.addEventListener('click', translateMergedValues);
    btnCopy.addEventListener('click', copyResult);
    btnCopyMaster.addEventListener('click', () => copyInput(masterEl, btnCopyMaster));
    btnCopyChild.addEventListener('click', () => copyInput(childEl, btnCopyChild));
    masterFileEl.addEventListener('change', () => loadJsonFile(masterFileEl, masterEl, 'Master'));
    childFileEl.addEventListener('change', () => loadJsonFile(childFileEl, childEl, 'Child'));

    async function loadServerFileOptions() {
      try {
        const response = await fetch('/api/locale-files', { headers: { 'Accept': 'application/json' } });
        const payload = await response.json();

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || 'Unable to list locale files.');
        }

        [masterServerFileEl, childServerFileEl].forEach(select => {
          payload.files.forEach(filename => {
            const option = document.createElement('option');
            option.value = filename;
            option.textContent = filename;
            select.appendChild(option);
          });
        });
      } catch (error) {
        // Local file upload and paste remain available if the server folder is absent.
      }
    }

    masterServerFileEl.addEventListener('change', () => loadServerJsonFile(masterServerFileEl, masterEl, 'Master'));
    childServerFileEl.addEventListener('change', () => loadServerJsonFile(childServerFileEl, childEl, 'Child'));
    masterEl.addEventListener('input', () => {
      resetWorkflow();
      updateKeyCount(masterEl, masterCountEl);
    });
    childEl.addEventListener('input', () => {
      resetWorkflow();
      updateKeyCount(childEl, childCountEl);
    });
    document.getElementById('btn-sample').addEventListener('click', () => {
      masterEl.value = samples.master;
      childEl.value = samples.child;
      resetWorkflow();
      updateKeyCount(masterEl, masterCountEl);
      updateKeyCount(childEl, childCountEl);
      showError('');
    });

    updateKeyCount(masterEl, masterCountEl);
    updateKeyCount(childEl, childCountEl);
    loadServerFileOptions();
  </script>
</body>
</html>
